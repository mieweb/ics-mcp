[project]
name = "ics-mcp"
version = "0.1.0"
description = "Read-only MCP server that exposes an iCalendar (.ics) feed — e.g. a published Outlook/Exchange calendar — as calendar query tools."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Medical Informatics Engineering" }]
keywords = ["mcp", "ical", "ics", "calendar", "outlook", "exchange"]
dependencies = [
    "mcp>=1.2.0,<2",
    "icalendar>=5.0.11",
    "python-dateutil>=2.8.2",
    "recurring-ical-events>=2.1.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/mieweb/ics-mcp"
Repository = "https://github.com/mieweb/ics-mcp"

[project.scripts]
ics-mcp = "ics_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ics_mcp"]
